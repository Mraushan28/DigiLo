[build]
  command = "npm run build && rm -rf .next/cache"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,.next/cache/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_WHATSAPP_NUMBER,NEXT_PUBLIC_NEXTODYSSEY_CONTRACT_URL,NVIDIA_BASE_URL,NVIDIA_MODEL,GOOGLE_REDIRECT_URI,SLACK_REDIRECT_URI,SLACK_CLIENT_ID,GOOGLE_CLIENT_ID,RESEND_API_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
